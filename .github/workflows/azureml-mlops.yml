name: Azure ML MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-register-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Azure ML CLI
      run: |
        pip install azure-cli
        az extension add -n ml -y

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Configure defaults
      run: |
        az configure --defaults group=${{ secrets.AZURE_RESOURCE_GROUP }} workspace=${{ secrets.AZURE_ML_WORKSPACE }}

    - name: Submit training job
      run: |
        az ml job create -f src/pipelines/train.yml --stream

    - name: Register model
      run: |
        az ml model create -f src/pipelines/model.yml

    - name: Deploy to endpoint
      run: |
        az ml online-deployment create -f src/pipelines/deploy.yml --all-traffic
